name: Build SecNote APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build SecNote 1.4.15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "ERROR: command failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "$status"' ERR
          SETTINGS_FILE="$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle.kts was not found. Upload the contents of the SecNote project folder to the repository root."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Verify project files and application identity
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "ERROR: command failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "$status"' ERR
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$BUILD_FILE"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/PanicCredential.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/HiddenVault.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/NoteSaveQueue.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/StorageGate.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/Vault.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/ThumbnailDecodePolicy.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/PhotoDatePolicy.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/BackupManager.kt"
          if find "$PROJECT_DIR" -type f \( -iname '*.keystore' -o -iname '*.jks' -o -iname '*.p12' -o -iname '*.pfx' \) -not -path '*/.git/*' -print -quit | grep -q .; then
            echo "Remove private signing material from the repository before continuing."
            exit 1
          fi
          if find "$PROJECT_DIR" -type f \( -iname 'README*' -o -iname 'SECURITY*' -o -iname 'LICENSE*' -o -iname 'NOTICE*' -o -iname '*.md' -o -iname '*.markdown' -o -iname '*.txt' -o -iname '*.pdf' \) -not -path '*/.git/*' -print -quit | grep -q .; then
            echo "Remove documentation and notice files from the project snapshot before continuing."
            exit 1
          fi
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/AutoLockPolicy.kt"
          test -f "$PROJECT_DIR/app/src/androidTest/java/infernics/notes/PanicCredentialTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/NoteOrderingTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/AutoLockPolicyTest.kt"
          test -f "$PROJECT_DIR/app/src/androidTest/java/infernics/notes/HiddenVaultTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/ThumbnailDecodePolicyTest.kt"
          test -f "$PROJECT_DIR/app/src/androidTest/java/infernics/notes/CryptoTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/PasswordKdfTest.kt"
          test -f "$PROJECT_DIR/app/src/androidTest/java/infernics/notes/PasswordKdfInstrumentedTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/BackupArchiveRulesTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/PhotoDatePolicyTest.kt"
          grep -Fq 'persistedVerifierDoesNotContainThePassphrase' "$PROJECT_DIR/app/src/androidTest/java/infernics/notes/HiddenVaultTest.kt"
          grep -Fq 'internal fun createRecord' "$PROJECT_DIR/app/src/main/java/infernics/notes/PanicCredential.kt"
          grep -Fq 'internal fun verifyRecord' "$PROJECT_DIR/app/src/main/java/infernics/notes/PanicCredential.kt"
          grep -Fq 'applicationId = "infernics.notes"' "$BUILD_FILE"
          grep -Fq 'compileSdk = 35' "$BUILD_FILE"
          grep -Fq 'androidx.exifinterface:exifinterface:1.3.7' "$BUILD_FILE"
          grep -Fq 'id("com.android.application") version "8.6.1" apply false' "$PROJECT_DIR/build.gradle.kts"
          grep -Fq 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-core:1.5.3' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-camera2:1.5.3' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-lifecycle:1.5.3' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-view:1.5.3' "$BUILD_FILE"
          grep -Fq 'namespace = "infernics.notes"' "$BUILD_FILE"
          grep -Fq 'versionCode = 23' "$BUILD_FILE"
          grep -Fq 'versionName = "1.4.15"' "$BUILD_FILE"
          grep -Fq 'testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"' "$BUILD_FILE"
          grep -Fq 'com.lambdapioneer.argon2kt:argon2kt:1.6.0' "$BUILD_FILE"
          grep -Fq 'mCostInKibibyte = MEMORY_KIB' "$PROJECT_DIR/app/src/main/java/infernics/notes/PasswordKdf.kt"
          grep -Fq 'tCostInIterations = ITERATIONS' "$PROJECT_DIR/app/src/main/java/infernics/notes/PasswordKdf.kt"
          grep -Fq 'Argon2Mode.ARGON2_ID' "$PROJECT_DIR/app/src/main/java/infernics/notes/PasswordKdf.kt"
          grep -Fq 'parallelism = PARALLELISM' "$PROJECT_DIR/app/src/main/java/infernics/notes/PasswordKdf.kt"
          grep -Fq 'Argon2Version.V13' "$PROJECT_DIR/app/src/main/java/infernics/notes/PasswordKdf.kt"
          grep -Fq 'matchesArgon2idVersion13ReferenceVector' "$PROJECT_DIR/app/src/androidTest/java/infernics/notes/PasswordKdfInstrumentedTest.kt"
          grep -Fq 'SecNoteVaultSaltKey' "$PROJECT_DIR/app/src/main/java/infernics/notes/Vault.kt"
