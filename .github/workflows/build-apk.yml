          grep -Fq 'getExternalFilesDirs(null)' "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          grep -Fq 'HiddenVault.DIRECTORY_NAME' "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          grep -Fq 'IdentityHashMap<Crypto, Boolean>' "$PROJECT_DIR/app/src/main/java/infernics/notes/Crypto.kt"
