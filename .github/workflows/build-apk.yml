          grep -Fq 'setInitialBiometricOfferPending(context, true)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'Включить биометрический вход?' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'isInitialBiometricOfferPending' "$PROJECT_DIR/app/src/main/java/infernics/notes/AppPreferences.kt"
          grep -Fq 'sourceDateCanRemainDifferentFromImportDate' "$PROJECT_DIR/app/src/test/java/infernics/notes/PhotoDatePolicyTest.kt"
          echo "Verified: infernics.notes, SecNote 1.4.15 (code 23), Argon2id profile, native KDF test setup, and existing application checks"

      - name: Run unit tests and build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle -p "${{ steps.project.outputs.dir }}" connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
