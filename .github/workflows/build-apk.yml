          grep -Fq 'lockCleanupPending = lockCleanupPending' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'lockCleanupPending: Boolean' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'val sessionKey = hiddenCrypto' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'onDispose { sessionKey?.destroy() }' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'PanicCredential.verify(context, suppliedPassword)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'HiddenVault.destroy(context)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
