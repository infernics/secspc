          grep -Fq 'setOf(-1, 0, 1, 5, 10, 15, 30)' "$PROJECT_DIR/app/src/main/java/infernics/notes/AutoLockPolicy.kt"
          grep -Fq 'shouldLockImmediately(autoLockMinutes)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
